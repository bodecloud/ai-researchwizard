      IMAGE_NAME_DOCKERHUB_SUFFIXED: ${{ github.event.repository.name }}${{ env.JOB_AIO_IMAGE_SUFFIX }}
      DOCKERFILE_PATH: ${{ env.JOB_AIO_DOCKERFILE }}
      BUILD_CONTEXT: ${{ env.JOB_AIO_CONTEXT }}
