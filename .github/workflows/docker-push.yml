# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# ------------------------------------------------------------------------------
# Multi-job Docker multi-arch build and push (GHCR + Docker Hub)
# ------------------------------------------------------------------------------
#
# REUSABLE INSTRUCTIONS:
#   1. All configurables are in the "Configuration" env block below. Edit that block only.
#   2. PLATFORMS = comma-separated list for QEMU/Buildx jobs. Matrix job (aio) uses its own strategy.
#   3. Each job has JOB_<ID>_IMAGE_SUFFIX, JOB_<ID>_DOCKERFILE, JOB_<ID>_CONTEXT. Image = repo name + suffix.
#   4. Secrets: GITHUB_TOKEN (auto) or GITHUB_PERSONAL_ACCESS_TOKEN; Docker Hub: DOCKERHUB_TOKEN (or DOCKER_*); optional DOCKER_USERNAME.
#
# ------------------------------------------------------------------------------

name: "Docker Multi-Arch Build and Push (matrix)"
run-name: ${{ github.actor }} – building and pushing Docker images

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  pull-requests: read

on:
  push:
    branches: ["*"]
    tags: ["*"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

# ------------------------------------------------------------------------------
# Configuration – edit only this block; all jobs reference these variables
# ------------------------------------------------------------------------------
env:
  PLATFORMS: "linux/amd64,linux/arm64,linux/arm/v7"
  # build-push-root
  JOB_ROOT_IMAGE_SUFFIX: ""
  JOB_ROOT_DOCKERFILE: "./Dockerfile"
  JOB_ROOT_CONTEXT: "."
  # build-push-frontend-nextjs
  JOB_FRONTEND_NEXTJS_IMAGE_SUFFIX: "-frontend-nextjs"
  JOB_FRONTEND_NEXTJS_DOCKERFILE: "./frontend/nextjs/Dockerfile.dev"
  JOB_FRONTEND_NEXTJS_CONTEXT: "./frontend/nextjs"
  # build-push-aio-fullstack
  JOB_AIO_IMAGE_SUFFIX: "-aio-fullstack"
  JOB_AIO_DOCKERFILE: "./Dockerfile.fullstack"
  JOB_AIO_CONTEXT: "."
  # build-push-mcp-server
  JOB_MCP_IMAGE_SUFFIX: "-mcp-server"
  JOB_MCP_DOCKERFILE: "./mcp-server/Dockerfile"
  JOB_MCP_CONTEXT: "./mcp-server"
  # build-push-docs-discord-bot
  JOB_DOCS_DISCORD_IMAGE_SUFFIX: "-docs-discord-bot"
  JOB_DOCS_DISCORD_DOCKERFILE: "./docs/discord-bot/Dockerfile"
  JOB_DOCS_DISCORD_CONTEXT: "./docs/discord-bot"

jobs:
  build-push-root:
    name: "Build Root Image"
    # This line makes it possible to cancel a workflow in the middle of a step. Otherwise the step needs to complete first.
    if: ${{ success() || failure() }}
    runs-on: ubuntu-latest
    env:
      # Variables for Docker tokens and authentication
      IMAGE_NAME_GHCR_SUFFIXED: ${{ github.event.repository.name }}${{ env.JOB_ROOT_IMAGE_SUFFIX }}
      IMAGE_NAME_DOCKERHUB_SUFFIXED: ${{ github.event.repository.name }}${{ env.JOB_ROOT_IMAGE_SUFFIX }}
      DOCKERFILE_PATH: ${{ env.JOB_ROOT_DOCKERFILE }}
      BUILD_CONTEXT: ${{ env.JOB_ROOT_CONTEXT }}
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        # This line makes it possible to cancel a workflow in the middle of a step. Otherwise the step needs to complete first.
        if: ${{ success() || failure() }}
        with:
          fetch-depth: 0
      - name: "Set up QEMU"
        uses: docker/setup-qemu-action@v3
        # This line makes it possible to cancel a workflow in the middle of a step. Otherwise the step needs to complete first.
        if: ${{ success() || failure() }}
      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3
        # This line makes it possible to cancel a workflow in the middle of a step. Otherwise the step needs to complete first.
        if: ${{ success() || failure() }}
      - name: "Set Docker token variables"
        id: set-tokens
        run: |
          echo "GITHUB_AUTH_TOKEN=${{ secrets.GITHUB_TOKEN || secrets.GITHUB_PERSONAL_ACCESS_TOKEN || '' }}" >> $GITHUB_ENV
          echo "DOCKER_TOKEN=${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_ACCESS_TOKEN || secrets.DOCKER_HUB_TOKEN || secrets.DOCKER_TOKEN || '' }}" >> $GITHUB_ENV
          echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME || github.repository_owner }}" >> $GITHUB_ENV
          if [[ -n "${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_ACCESS_TOKEN || secrets.DOCKER_HUB_TOKEN || secrets.DOCKER_TOKEN || '' }}" ]]; then
            echo "DOCKERHUB_AUTH=true" >> $GITHUB_ENV
          else
            echo "DOCKERHUB_AUTH=false" >> $GITHUB_ENV
          fi
      - name: "Log in to GitHub Container Registry"
        uses: docker/login-action@v3
        # This line makes it possible to cancel a workflow in the middle of a step. Otherwise the step needs to complete first.
        if: ${{ success() || failure() }}
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ env.GITHUB_AUTH_TOKEN }}
      - name: "Log in to Docker Hub (if secrets present)"
        if: env.DOCKERHUB_AUTH == 'true' && ${{ success() || failure() }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_TOKEN }}
      - name: "Extract Docker metadata"
        id: meta
        uses: docker/metadata-action@v5
        # This line makes it possible to cancel a workflow in the middle of a step. Otherwise the step needs to complete first.
        if: ${{ success() || failure() }}
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME_GHCR_SUFFIXED }}
            ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME_DOCKERHUB_SUFFIXED }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=latest
            type=raw,value=dev,enable=${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=ref,event=branch,prefix=
            type=ref,event=pr
      - name: "Build and push Docker image"
        uses: docker/build-push-action@v6
        # This line makes it possible to cancel a workflow in the middle of a step. Otherwise the step needs to complete first.
        if: ${{ success() || failure() }}
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.DOCKERFILE_PATH }}
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

