      IMAGE_NAME_DOCKERHUB_SUFFIXED: ${{ github.event.repository.name }}${{ env.JOB_MCP_IMAGE_SUFFIX }}
      DOCKERFILE_PATH: ${{ env.JOB_MCP_DOCKERFILE }}
      BUILD_CONTEXT: ${{ env.JOB_MCP_CONTEXT }}
